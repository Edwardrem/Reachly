# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
# (brew install xcodegen). The generated Reachly.xcodeproj is git-ignored.
name: Reachly
options:
  bundleIdPrefix: io.github.edwardrem
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ReachlyKit:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
targets:
  Reachly:
    type: application
    platform: macOS
    sources:
      - path: App/Reachly
        excludes:
          - "Fonts/**"
      - path: App/Reachly/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: ReachlyKit
        product: ReachlyCore
      - package: ReachlyKit
        product: ReachlySSH
      - package: ReachlyKit
        product: ReachlyTerminal
      - package: ReachlyKit
        product: ReachlyAgent
      - package: Sparkle
        product: Sparkle
      # The MCP stdio bridge ships inside the app bundle (Contents/MacOS/reachly-mcp).
      - target: reachly-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Reachly/Info.plist
      properties:
        CFBundleName: Reachly
        CFBundleDisplayName: Reachly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 Rufaro Edward Mutepfa. MIT License."
        # Dictation in the Claude composer. Transcription is on-device
        # (requiresOnDeviceRecognition), so audio never leaves the Mac.
        NSMicrophoneUsageDescription: "Reachly uses the microphone only while you dictate a chat message."
        NSSpeechRecognitionUsageDescription: "Dictation transcribes your speech on this Mac so you can talk to the assistant instead of typing. Audio is not sent to Apple."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # macOS 26/27 workaround. Forces the pre-Swift-6 (thread-based) executor
        # check, so SwiftUI's own hover hit-testing on the main thread does not
        # dereference a stale platform-view responder's executor identity and
        # crash (swift_task_isCurrentExecutorWithFlags → swift_getObjectType, a
        # system use-after-free that crashes many apps). LaunchServices sets this
        # before launch; ReachlyApp also setenv()s it for direct runs.
        LSEnvironment:
          SWIFT_IS_CURRENT_EXECUTOR_LEGACY_MODE_OVERRIDE: legacy
        # Fonts in Contents/Resources/Fonts are available to the app (JetBrains Mono, OFL).
        ATSApplicationFontsPath: Fonts
        # Sparkle. SUPublicEDKey is filled in once `generate_keys` has been run
        # (see docs/RELEASING.md); until then updates are download-only.
        SUFeedURL: https://edwardrem.github.io/Reachly/appcast.xml
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.edwardrem.reachly
            CFBundleURLSchemes: [reachly]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Reachly Export
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.edwardrem.reachly.export]
          - CFBundleTypeName: iTerm2 Color Scheme
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.googlecode.iterm2.itermcolors]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.googlecode.iterm2.itermcolors
            UTTypeDescription: iTerm2 Color Scheme
            UTTypeConformsTo: [com.apple.property-list]
            UTTypeTagSpecification:
              public.filename-extension: [itermcolors]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.edwardrem.reachly.export
            UTTypeDescription: Reachly Export
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [reachly]
              public.mime-type: [application/vnd.reachly+json]
    entitlements:
      path: App/Reachly/Reachly.entitlements
      properties:
        # Not sandboxed yet: reading keys from ~/.ssh and (later) ~/.ssh/config
        # interop are far simpler outside the sandbox. Revisit before any
        # App Store distribution.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        # Microphone for composer dictation (required under the hardened runtime).
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.edwardrem.reachly
        PRODUCT_NAME: Reachly
        MARKETING_VERSION: "1.1.3"
        CURRENT_PROJECT_VERSION: "14"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Off for ad-hoc builds: the hardened runtime's library validation needs a
        # Team ID, so an ad-hoc signed app cannot load its embedded Sparkle
        # framework and dies at launch. release.yml turns it on (YES) when it
        # signs with a Developer ID, which notarization requires.
        ENABLE_HARDENED_RUNTIME: false
        # Ad-hoc signing until a Developer ID certificate is available (see docs/PLAN.md).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        DEAD_CODE_STRIPPING: true
  reachly-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Sources/reachly-mcp
    settings:
      base:
        PRODUCT_NAME: reachly-mcp
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: true
        DEAD_CODE_STRIPPING: true
schemes:
  Reachly:
    build:
      targets:
        Reachly: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    archive:
      config: Release
