name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" && xcodebuild -version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Unit tests
        # The test count goes to the run's summary page, which anyone can open.
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/unit.log"
          grep -E "Test run with [0-9]+ tests" "$RUNNER_TEMP/unit.log" | sed -E 's/^.*(Test run with)/Unit tests: \1/' >> "$GITHUB_STEP_SUMMARY"

      - name: Live SSH tests
        # The throwaway sshd on a shared runner is slow to answer now and then
        # (a host-key prompt or a connect timing out at 20 s), so one retry.
        run: |
          Scripts/test-sshd.sh start
          source .build/test-sshd/env.sh
          # A failed run prints the end of sshd's log, so a failure on the runner can be diagnosed; the retry
          # runs one test at a time.
          swift test --filter Live || {
            echo "::warning::live tests failed once; retrying one at a time"
            tail -40 .build/test-sshd/sshd.log || true
            swift test --filter Live --no-parallel || { tail -80 .build/test-sshd/sshd.log; exit 1; }
          }
          Scripts/test-sshd.sh stop

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app (ad-hoc signed)
        run: |
          xcodegen generate
          xcodebuild -project Reachly.xcodeproj -scheme Reachly -configuration Debug \
            -derivedDataPath .build/DerivedData -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGN_IDENTITY=- build | tail -5
